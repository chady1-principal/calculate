<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시니어 큰 글씨 계산기</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #f7f1df;
        color: #2f2f2f;
        font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .app {
        width: min(560px, 94vw);
        margin: 20px auto;
    }

    h1 {
        text-align: center;
        font-size: clamp(28px, 6vw, 42px);
        margin: 10px 0 20px;
    }

    /* 탭 */
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .tab {
        flex: 1;
        border: none;
        border-radius: 15px;
        padding: 17px 8px;
        background: #ddd4bd;
        color: #333;
        font-size: clamp(20px, 4.5vw, 28px);
        font-weight: bold;
        cursor: pointer;
    }

    .tab.active {
        background: #355c4b;
        color: white;
    }

    /* 계산기 */
    .calculator {
        background: #fffaf0;
        border-radius: 25px;
        padding: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .display {
        width: 100%;
        min-height: 105px;
        background: #26332e;
        color: #ffffff;
        border-radius: 18px;
        margin-bottom: 15px;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        overflow: hidden;
        text-align: right;
        font-size: clamp(40px, 10vw, 68px);
        font-weight: bold;
        letter-spacing: 1px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button.calc-btn {
        border: none;
        border-radius: 18px;
        min-height: 78px;
        font-size: clamp(30px, 7vw, 44px);
        font-weight: bold;
        cursor: pointer;
        background: #e8dfc9;
        color: #222;
        box-shadow: 0 4px 0 #c8bea7;
        touch-action: manipulation;
    }

    button.calc-btn:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #c8bea7;
    }

    .operator {
        background: #d6e3dc !important;
        color: #244c3c !important;
    }

    .clear {
        background: #e5b9a9 !important;
        color: #632d20 !important;
    }

    .equal {
        background: #355c4b !important;
        color: white !important;
    }

    /* 나이 계산기 */
    .age-box {
        display: none;
        background: #fffaf0;
        border-radius: 25px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .age-box.show {
        display: block;
    }

    .age-title {
        text-align: center;
        font-size: clamp(28px, 6vw, 40px);
        font-weight: bold;
        margin-bottom: 25px;
    }

    .birth-label {
        display: block;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: bold;
        margin-bottom: 10px;
    }

    input[type="date"] {
        width: 100%;
        height: 70px;
        border: 3px solid #b8ad95;
        border-radius: 15px;
        background: white;
        font-size: clamp(25px, 6vw, 34px);
        padding: 8px 12px;
        color: #222;
    }

    .age-calc {
        width: 100%;
        margin-top: 20px;
        padding: 20px;
        border: none;
        border-radius: 18px;
        background: #355c4b;
        color: white;
        font-size: clamp(25px, 6vw, 34px);
        font-weight: bold;
        cursor: pointer;
    }

    .age-result {
        margin-top: 20px;
        min-height: 130px;
        border-radius: 18px;
        background: #f0eadb;
        padding: 20px;
        text-align: center;
        font-size: clamp(25px, 6vw, 35px);
        font-weight: bold;
        line-height: 1.6;
    }

    .help {
        text-align: center;
        font-size: 18px;
        margin-top: 18px;
        color: #555;
    }

    @media (max-width: 430px) {
        .app {
            width: 96vw;
            margin: 10px auto;
        }

        .calculator {
            padding: 12px;
        }

        .buttons {
            gap: 7px;
        }

        button.calc-btn {
            min-height: 70px;
            border-radius: 15px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>🌿 시니어 큰 글씨 계산기</h1>

    <!-- 상단 탭 -->
    <div class="tabs">
        <button class="tab active" onclick="showTab('calculator', this)">
            🧮 계산기
        </button>

        <button class="tab" onclick="showTab('age', this)">
            🎂 나이 계산
        </button>
    </div>

    <!-- 계산기 -->
    <div id="calculator" class="calculator">

        <div id="display" class="display">0</div>

        <div class="buttons">

            <button class="calc-btn clear" onclick="press('C')">C</button>
            <button class="calc-btn" onclick="press('back')">⌫</button>
            <button class="calc-btn operator" onclick="press('÷')">÷</button>
            <button class="calc-btn operator" onclick="press('×')">×</button>

            <button class="calc-btn" onclick="press('7')">7</button>
            <button class="calc-btn" onclick="press('8')">8</button>
            <button class="calc-btn" onclick="press('9')">9</button>
            <button class="calc-btn operator" onclick="press('-')">−</button>

            <button class="calc-btn" onclick="press('4')">4</button>
            <button class="calc-btn" onclick="press('5')">5</button>
            <button class="calc-btn" onclick="press('6')">6</button>
            <button class="calc-btn operator" onclick="press('+')">+</button>

            <button class="calc-btn" onclick="press('1')">1</button>
            <button class="calc-btn" onclick="press('2')">2</button>
            <button class="calc-btn" onclick="press('3')">3</button>
            <button class="calc-btn equal" onclick="press('=')">=</button>

            <button class="calc-btn" onclick="press('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="press('.')">.</button>

        </div>

        <div class="help">
            버튼을 누르면 소리가 납니다 🔊
        </div>

    </div>

    <!-- 나이 계산기 -->
    <div id="age" class="age-box">

        <div class="age-title">
            🎂 내 만 나이 계산하기
        </div>

        <label class="birth-label" for="birth">
            생년월일을 선택하세요
        </label>

        <input type="date" id="birth">

        <button class="age-calc" onclick="calculateAge()">
            나이 계산하기
        </button>

        <div id="ageResult" class="age-result">
            생년월일을 입력하면<br>
            만 나이를 알려드립니다.
        </div>

    </div>

</div>

<script>

    /* =========================
       효과음
    ========================= */

    let audioContext;

    function playSound() {

        try {

            if (!audioContext) {
                audioContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                520,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                760,
                audioContext.currentTime + 0.06
            );

            gain.gain.setValueAtTime(
                0.08,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.09
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(
                audioContext.currentTime + 0.09
            );

        } catch (e) {
            // 소리를 지원하지 않는 환경에서는 조용히 진행
        }
    }


    /* =========================
       계산기
    ========================= */

    let current = "";
    let previous = "";
    let operator = null;
    let resetScreen = false;

    const display =
        document.getElementById("display");


    function press(value) {

        playSound();

        if (value === "C") {

            current = "";
            previous = "";
            operator = null;
            resetScreen = false;

            updateDisplay();
            return;
        }


        if (value === "back") {

            current =
                current.slice(0, -1);

            if (current === "") {
                current = "";
            }

            updateDisplay();
            return;
        }


        if (
            value === "+" ||
            value === "-" ||
            value === "×" ||
            value === "÷"
        ) {

            if (current === "" && previous === "") {
                return;
            }

            if (previous !== "" && current !== "") {
                calculate();
            }

            previous = current;
            current = "";
            operator = value;

            resetScreen = false;

            updateDisplay();
            return;
        }


        if (value === "=") {

            if (
                previous !== "" &&
                current !== "" &&
                operator
            ) {
                calculate();
            }

            return;
        }


        if (value === ".") {

            if (!current.includes(".")) {

                if (current === "") {
                    current = "0.";
                } else {
                    current += ".";
                }

            }

            updateDisplay();
            return;
        }


        if (resetScreen) {
            current = "";
            resetScreen = false;
        }

        current += value;

        updateDisplay();
    }


    function calculate() {

        const a = parseFloat(previous);
        const b = parseFloat(current);

        let result;


        switch (operator) {

            case "+":
                result = a + b;
                break;

            case "-":
                result = a - b;
                break;

            case "×":
                result = a * b;
                break;

            case "÷":

                if (b === 0) {

                    display.textContent =
                        "0으로 나눌 수 없음";

                    current = "";
                    previous = "";
                    operator = null;

                    return;
                }

                result = a / b;
                break;
        }


        if (
            !Number.isInteger(result)
        ) {
            result =
                parseFloat(result.toFixed(10));
        }


        current = String(result);

        previous = "";
        operator = null;

        resetScreen = true;

        updateDisplay();
    }


    function updateDisplay() {

        display.textContent =
            current || previous || "0";
    }


    /* =========================
       탭 전환
    ========================= */

    function showTab(tabName, button) {

        playSound();

        document
            .querySelectorAll(".tab")
            .forEach(tab => {
                tab.classList.remove("active");
            });

        button.classList.add("active");


        document
            .getElementById("calculator")
            .style.display =
            tabName === "calculator"
                ? "block"
                : "none";


        document
            .getElementById("age")
            .classList.toggle(
                "show",
                tabName === "age"
            );
    }


    /* =========================
       나이 계산
    ========================= */

    function calculateAge() {

        playSound();

        const birth =
            document.getElementById("birth").value;

        const resultBox =
            document.getElementById("ageResult");


        if (!birth) {

            resultBox.innerHTML =
                "생년월일을 먼저 선택해주세요.";

            return;
        }


        const birthDate =
            new Date(birth + "T00:00:00");

        const today =
            new Date();


        let age =
            today.getFullYear()
            - birthDate.getFullYear();


        const monthDifference =
            today.getMonth()
            - birthDate.getMonth();


        if (
            monthDifference < 0 ||
            (
                monthDifference === 0 &&
                today.getDate()
                < birthDate.getDate()
            )
        ) {
            age--;
        }


        const nextBirthday =
            new Date(
                today.getFullYear(),
                birthDate.getMonth(),
                birthDate.getDate()
            );


        if (nextBirthday < today) {
            nextBirthday.setFullYear(
                today.getFullYear() + 1
            );
        }


        const days =
            Math.ceil(
                (
                    nextBirthday - today
                )
                /
                (1000 * 60 * 60 * 24)
            );


        resultBox.innerHTML =
            `현재 만 <strong>${age}세</strong>입니다.<br>
             🎉 다음 생일까지 <strong>${days}일</strong> 남았습니다.`;
    }

</script>

</body>
</html>
